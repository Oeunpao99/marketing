services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: ${POSTGRES_DB:-dispatch}
    volumes:
      - dispatch-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dispatch} -d ${POSTGRES_DB:-dispatch}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host — only the backend needs it, reached over the
    # compose network. Uncomment only if you need a GUI client to reach it
    # directly (not recommended in production; prefer an SSH tunnel instead).
    # ports:
    #   - "5433:5432"

  backend:
    build: ./dispatch/backend
    restart: unless-stopped
    # Everything else (Azure/TikTok/Meta keys, FRONTEND_URL, SECRET_KEY, …)
    # comes from here — copy dispatch/backend/.env.example to
    # dispatch/backend/.env and fill in real production values first.
    env_file:
      - ./dispatch/backend/.env
    environment:
      # Always the compose-internal db, regardless of what's in .env (that
      # file's DATABASE_URL is for local dev against localhost:5433).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dispatch}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dispatch}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./dispatch
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  dispatch-db-data:

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # AI-generated video/image uploads — matches app/media.py's own 200MB cap.
    client_max_body_size 200M;

    # Look the backend up through Docker's DNS on every request (cached 10s)
    # instead of once at startup — otherwise recreating only the backend
    # container can leave nginx pointing at its old, dead address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Backend API — "backend" is the compose service name/hostname. With a
    # variable in proxy_pass the request uri is passed through unchanged.
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Backend unreachable (mid-deploy): answer like maintenance mode so the
        # app shows its "updating" screen instead of raw errors. No
        # proxy_intercept_errors, so this fires only for nginx's own 502 (can't
        # connect) — the backend's deliberate 502s (AI service errors) and 503s
        # pass through untouched.
        error_page 502 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        add_header Retry-After 15 always;
        return 503 '{"detail":"ContentFlow is updating to a new version. This usually takes under a minute.","maintenance":true}';
    }

    # Generated/uploaded media, served straight from the backend.
    location /media/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # Installable app (PWA): the service worker, manifest and page itself must
    # never be cached long, or phones keep running an old build.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # React Router — any unmatched path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # AI-generated video/image uploads — matches app/media.py's own 200MB cap.
    client_max_body_size 200M;

    # Backend API — "backend" is the compose service name/hostname.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Generated/uploaded media, served straight from the backend.
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
    }

    # React Router — any unmatched path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

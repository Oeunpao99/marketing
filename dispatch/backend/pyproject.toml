[project]
name = "dispatch-backend"
version = "0.1.0"
description = "Backend API for the Ti P'sa / Dispatch social content portal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "pywebpush>=2.5.0",
    "imageio-ffmpeg>=0.6.0",
    "pillow>=11",
    "azure-cognitiveservices-speech>=1.40",
    # The local Khmer voice (app/local_voice.py, KHMER_TTS_MODEL): a small
    # open-source TTS model run on the server's CPU.
    "torch>=2.4",
    "transformers>=4.44",
    "numpy>=1.26",
    "anthropic>=1.14",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
]

[tool.uv]
package = false

# PyTorch's CPU-only build — the default one carries GPU libraries (~2 GB) the
# server has no use for.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query() in defaults is the intended idiom.
ignore = ["B008"]
